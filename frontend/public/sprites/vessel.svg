<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 256" width="64" height="256">
  <!-- Top-down vessel silhouette. Bow points up (+Y in SVG = forward). The
       shader's perpendicular-tilt mode aligns the quad's local +Y with the
       curve tangent, so this orientation puts the bow ahead of the ship. -->
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#cdd1d6"/>
    </linearGradient>
  </defs>
  <!-- Hull: tapered prow at top, rounded stern at bottom. -->
  <path d="M 32 8
           L 50 56
           L 54 200
           L 48 240
           L 16 240
           L 10 200
           L 14 56
           Z"
        fill="url(#hull)" stroke="#3a3f44" stroke-width="2" stroke-linejoin="round"/>
  <!-- Forward deck -->
  <rect x="22" y="80" width="20" height="100" rx="2" fill="#d9d9d9"/>
  <!-- Bridge superstructure -->
  <rect x="20" y="130" width="24" height="40" rx="3" fill="#9aa3ac"/>
  <!-- Bridge windows accent stripe -->
  <rect x="22" y="138" width="20" height="4" fill="#1a1f24"/>
  <!-- Stern cap -->
  <rect x="20" y="218" width="24" height="14" rx="3" fill="#9aa3ac"/>
</svg>
