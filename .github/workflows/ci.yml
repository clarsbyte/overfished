name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev tools
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: codegen_py
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pydantic for TS codegen
        run: pip install "pydantic>=2"
      - name: Install frontend deps
        run: npm install
      - name: Codegen + typecheck
        env:
          SKIP_DATA_LINK: "1"
          CODEGEN_PYTHON: ${{ steps.codegen_py.outputs.python-path }}
        run: npm run typecheck
      - name: Build
        env:
          SKIP_DATA_LINK: "1"
          CODEGEN_PYTHON: ${{ steps.codegen_py.outputs.python-path }}
        run: npm run build
