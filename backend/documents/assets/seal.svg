<svg class="seal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rings -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#0a2540" stroke-width="1.4"/>
  <circle cx="50" cy="50" r="44.5" fill="none" stroke="#0a2540" stroke-width="0.4"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#0a2540" stroke-width="0.5"/>

  <!-- Curved text paths -->
  <defs>
    <path id="topArc" d="M 14,50 A 36,36 0 0 1 86,50" fill="none"/>
    <path id="bottomArc" d="M 18,55 A 32,32 0 0 0 82,55" fill="none"/>
  </defs>

  <text font-family="EB Garamond, serif" font-size="5.4" font-weight="600" fill="#0a2540" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">{{ seal_top_text | default('DIRECCIÓN PARQUE NACIONAL GALÁPAGOS') }}</textPath>
  </text>
  <text font-family="EB Garamond, serif" font-size="4.8" font-weight="500" fill="#0a2540" letter-spacing="0.6">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">{{ seal_bottom_text | default('★ MARINE ENFORCEMENT ★ EST. 1959 ★') }}</textPath>
  </text>

  <!-- Decorative stars at sides -->
  <text x="9" y="53" font-size="6" fill="#0a2540">★</text>
  <text x="85" y="53" font-size="6" fill="#0a2540">★</text>

  <!-- Center anchor + waves emblem -->
  <g transform="translate(50,52)">
    <circle cx="0" cy="-13" r="2.6" fill="none" stroke="#0a2540" stroke-width="1.2"/>
    <line x1="0" y1="-10.2" x2="0" y2="13" stroke="#0a2540" stroke-width="1.4"/>
    <line x1="-6.5" y1="-5" x2="6.5" y2="-5" stroke="#0a2540" stroke-width="1.4"/>
    <path d="M -10,8 Q -10,14 0,14 Q 10,14 10,8" fill="none" stroke="#0a2540" stroke-width="1.4"/>
    <line x1="-10" y1="8" x2="-13.5" y2="11" stroke="#0a2540" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="10" y1="8" x2="13.5" y2="11" stroke="#0a2540" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M -15,19 Q -8,17 0,19 T 15,19" fill="none" stroke="#0a2540" stroke-width="0.7"/>
    <path d="M -13,21.5 Q -7,19.5 0,21.5 T 13,21.5" fill="none" stroke="#0a2540" stroke-width="0.55"/>
  </g>
</svg>
