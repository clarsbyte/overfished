[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overfished-langchain-plugin"
version = "0.1.0"
description = "Optional LangChain implementation of Overfished AgentBackend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
langchain = [
  "langchain-core>=0.3.0",
]
dev = ["ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/overfished_langchain_plugin"]

[tool.ruff]
line-length = 100
target-version = "py311"
