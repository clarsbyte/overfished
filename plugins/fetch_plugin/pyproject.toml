[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overfished-fetch-plugin"
version = "0.1.0"
description = "Optional Fetch.ai-style implementation of Overfished AgentBackend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/overfished_fetch_plugin"]

[tool.ruff]
line-length = 100
target-version = "py311"
