[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overfished-api"
version = "0.1.0"
description = "Overfished BFF API (scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "auth0-fastapi-api>=1.0.0b7",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "twilio>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]
# Install the local package first: `pip install -e ./ml` then `pip install -e "./api[ml]"` for sequence routes.
ml = [
  "overfished-ml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/overfished_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
