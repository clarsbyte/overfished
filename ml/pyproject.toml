[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overfished-ml"
version = "0.1.0"
description = "Overfished ML/CV library (stubs for Databricks alignment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sql-connector",
    "pandas",
    "pyspark",
    "python-dotenv",
    "torch>=2.2.0",
]

[project.scripts]
overfished-pipeline = "overfished_ml.local_pipeline.cli:main"
overfished-enrich-images = "overfished_ml.image_enrichment.cli:main"
overfished-sequence-report = "overfished_ml.sequence.cli:main"
overfished-gx10 = "overfished_ml.local_pipeline.gx10_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/overfished_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
