[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overfished-ml"
version = "0.1.0"
description = "Overfished ML/CV library (stubs for Databricks alignment)"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/overfished_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
